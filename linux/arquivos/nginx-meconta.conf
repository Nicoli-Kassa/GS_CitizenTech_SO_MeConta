# Site do Me Conta no nginx (instalado por linux/etapas/aplicacao.sh).
# O nginx é a única porta de entrada: a API escuta só em 127.0.0.1 e não é acessível de fora.

# Log de acesso no formato de auditoria: quem (IP), quando, o quê (método e caminho) e o resultado.
# O caminho vai sem a query string, para não gravar parâmetros no log.
log_format meconta_auditoria '$time_iso8601 ip=$remote_addr metodo=$request_method caminho=$uri '
                             'status=$status bytes=$body_bytes_sent tempo=${request_time}s '
                             'api=$upstream_status agente="$http_user_agent"';

# Limite de requisições por IP (uma camada simples de proteção, no espírito de um WAF):
#   login: 5 por minuto (dificulta tentar senhas em massa) | resto da API: 20 por segundo
limit_req_zone $binary_remote_addr zone=meconta_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=meconta_api:10m rate=20r/s;

upstream meconta_api {
    # Nome resolvido pelo /etc/hosts (etapa rede): api.{{DOMINIO_INTERNO}} -> 127.0.0.1
    server api.{{DOMINIO_INTERNO}}:{{PORTA_INTERNA_DA_API}};
    keepalive 16;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name {{NOME_PUBLICO}} _;

    server_tokens off;                      # não revela a versão do nginx
    client_max_body_size 25m;               # áudio de até 20 MB + foto

    access_log /var/log/nginx/meconta-acesso.log meconta_auditoria;
    error_log  /var/log/nginx/meconta-erros.log warn;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
    limit_req_status 429;

    # A raiz abre a documentação da API.
    location = / {
        return 302 /swagger/;
    }

    # Painel do servidor: CPU, memória, disco e alertas, lidos do monitor (status.json).
    location = /servidor {
        return 301 /servidor/;
    }
    location = /servidor/status.json {
        alias /run/meconta-monitor/status.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
    }
    location /servidor/ {
        alias /var/www/meconta-servidor/;
        index index.html;
    }

    location = /api/v1/auth/login {
        limit_req zone=meconta_login burst=5 nodelay;
        proxy_pass http://meconta_api;
    }

    location / {
        limit_req zone=meconta_api burst=40 nodelay;
        proxy_pass http://meconta_api;
    }
}
