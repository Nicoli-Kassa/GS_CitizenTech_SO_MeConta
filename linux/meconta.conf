# Configuração do servidor Linux do Me Conta.
# Todos os scripts de provisionamento leem este arquivo. Mude aqui, não dentro dos scripts.
# Formato: VARIAVEL="valor" (é lido pelo Bash com "source").

# ---------------------------------------------------------------------------
# Identidade do servidor (hostname e nomes)
# ---------------------------------------------------------------------------
NOME_DO_SERVIDOR="meconta-srv"                 # hostname curto
DOMINIO_INTERNO="meconta.interno"              # domínio local, resolvido pelo /etc/hosts
NOME_PUBLICO="meconta-nicoli.brazilsouth.cloudapp.azure.com"  # rótulo DNS do IP público no Azure
FUSO_HORARIO="America/Sao_Paulo"

# ---------------------------------------------------------------------------
# Rede (IP e DNS)
# ---------------------------------------------------------------------------
# "sim": grava o IP atual da placa como IP fixo no netplan (o mesmo IP fixado na NIC do Azure).
# A troca tem rollback automático: se a rede não responder em 120 s, a configuração anterior volta.
IP_ESTATICO="sim"
# Trava de segurança: o IP privado que você deixou como "Estático" na NIC do Azure (ex.: 10.0.0.4).
# O IP fixo só é gravado se este valor for igual ao IP atual da placa. Vazio = a etapa só mostra o IP.
IP_PRIVADO_FIXADO_NO_AZURE=""
# Servidores DNS, em ordem. 168.63.129.16 é o DNS interno do Azure (mantido por último).
SERVIDORES_DNS="1.1.1.1 9.9.9.9 168.63.129.16"

# ---------------------------------------------------------------------------
# Acesso e segurança
# ---------------------------------------------------------------------------
USUARIO_DO_SERVICO="meconta"                   # usuário sem login que roda a API
PORTAS_LIBERADAS="80/tcp"                      # além do SSH, que é sempre liberado com limite de tentativas
TAMANHO_SWAP_GB="2"                            # a B1s tem 1 GB de RAM; o swap evita falta de memória no build

# ---------------------------------------------------------------------------
# Aplicação
# ---------------------------------------------------------------------------
REPOSITORIO="https://github.com/Nicoli-Kassa/GS_CitizenTech_API_MeConta.git"
BRANCH="main"
PORTA_INTERNA_DA_API="5000"                    # a API só escuta em 127.0.0.1; o nginx publica na porta 80
DADOS_DE_DEMONSTRACAO="true"                   # cria a Família Souza, Bia e Cláudia (dados fictícios)
PAGINAS_DO_FILTRO_DE_PRIVACIDADE="true"        # páginas de exemplo do painel Risco Cidadão
VERSOES_GUARDADAS="3"                          # quantas versões publicadas ficam guardadas para rollback

# ---------------------------------------------------------------------------
# Monitoramento
# ---------------------------------------------------------------------------
LIMITE_CPU="80"                                # % de uso que dispara alerta
LIMITE_MEMORIA="80"
LIMITE_DISCO="80"
INTERVALO_SEGUNDOS="10"                        # de quanto em quanto tempo o monitor mede
LEITURAS_PARA_ALERTAR="3"                      # leituras seguidas acima do limite antes de alertar (evita pico isolado)
FALHAS_DE_SAUDE_PARA_REINICIAR="3"             # /health falhando N vezes seguidas: o monitor reinicia a API
ALERTA_WEBHOOK=""                              # opcional: URL (ex.: https://ntfy.sh/seu-topico) que recebe cada alerta
